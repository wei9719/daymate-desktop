name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  security:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write

  build:
    needs: [quality, security]
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    outputs:
      artifact-id: ${{ steps.release-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: npm ci
      - name: Validate tag, main ancestry and release notes
        shell: pwsh
        run: |
          node scripts/check-version.mjs --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw "Release version validation failed." }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release tags must point to a commit on main." }
          node scripts/release-notes.mjs $env:RELEASE_TAG release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "Release notes validation failed." }
          Add-Content -LiteralPath release-notes.md -Encoding utf8 -Value "`n## 云端验证记录`n`n[查看本版质量检查和四组安装测试](https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID)。全部通过后才公开本安装包；不替代 Windows 10/11 完整界面与外设验收。"
      - name: Build Windows installer
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          args: -- --locked
          includeUpdaterJson: false
      - name: Preserve the installer to test and publish unchanged
        id: release-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daymate-windows-release-${{ github.run_attempt }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            release-notes.md
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        scenario: [fresh, legacy-v4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      SMOKE_SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: release-artifact
      - name: Smoke test the installed Windows app
        timeout-minutes: 6
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          ./scripts/smoke-windows.ps1 -InstallerPath "release-artifact/src-tauri/target/release/bundle/nsis/DayMate_${version}_x64-setup.exe" -DataScenario $env:SMOKE_SCENARIO

  publish:
    needs: [build, smoke]
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: release-artifact
      - name: Create checksum and upload complete draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $installerName = "DayMate_${version}_x64-setup.exe"
          $installer = Get-Item -LiteralPath "release-artifact/src-tauri/target/release/bundle/nsis/$installerName" -ErrorAction Stop
          if ($installer.Length -eq 0) { throw "The installer is empty." }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $installerName" | Set-Content -LiteralPath SHA256SUMS.txt -Encoding ascii
          $existing = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw "Refusing to modify a published release." }
            gh release edit $env:RELEASE_TAG --title "DayMate $env:RELEASE_TAG" --notes-file release-artifact/release-notes.md
          } else {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title "DayMate $env:RELEASE_TAG" --notes-file release-artifact/release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not prepare the release draft." }
          gh release upload $env:RELEASE_TAG $installer.FullName SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload all release assets; the release remains a draft." }
          $releaseJson = gh release view $env:RELEASE_TAG --json assets,isDraft
          if ($LASTEXITCODE -ne 0) { throw "Could not verify uploaded assets." }
          $release = $releaseJson | ConvertFrom-Json
          if (-not $release.isDraft) { throw "Expected an unpublished release draft." }
          foreach ($file in @($installer, (Get-Item -LiteralPath SHA256SUMS.txt))) {
            $asset = @($release.assets | Where-Object { $_.name -eq $file.Name })
            if ($asset.Count -ne 1 -or $asset[0].size -ne $file.Length -or $asset[0].state -ne "uploaded") {
              throw "Uploaded asset verification failed: $($file.Name)."
            }
            $expectedDigest = "sha256:" + (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset[0].digest -and $asset[0].digest -ne $expectedDigest) {
              throw "Uploaded asset checksum mismatch: $($file.Name)."
            }
          }
      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the verified draft." }

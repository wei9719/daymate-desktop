name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      skip-ui:
        description: Release runs the same browser gate as a separate prerequisite.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ui-smoke:
    if: ${{ !inputs.skip-ui }}
    uses: ./.github/workflows/ui-smoke.yml

  dependency-audit:
    uses: ./.github/workflows/dependency-audit.yml

  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Report versioned synthetic music evaluation (not user satisfaction)
        run: npm run eval:music
      - run: node --test scripts/test-release.mjs scripts/test-audit-rust.mjs scripts/test-check-sarif.mjs
      - run: npm run build
      - run: npm run version:check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

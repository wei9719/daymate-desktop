name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  schedule:
    - cron: "20 2 * * 1"
permissions:
  contents: read
jobs:
  analyze:
    runs-on: windows-2022
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        id: codeql-analysis
        with:
          output: ${{ runner.temp }}/daymate-codeql-sarif
          # Release tags enforce the local SARIF gate; branch/PR scans also publish alerts.
          upload: ${{ startsWith(github.ref, 'refs/tags/') && 'never' || 'always' }}
          upload-database: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Block high-risk or incomplete CodeQL results
        env:
          SARIF_OUTPUT: ${{ steps.codeql-analysis.outputs.sarif-output }}
        run: node scripts/check-sarif.mjs "$env:SARIF_OUTPUT"
